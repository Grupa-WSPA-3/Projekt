<text x="585" y="500">tak →</text><text x="582" y="745">nie</text>
<text x="900" y="82">utwórz / edytuj</text><text x="900" y="164">pokaż listę</text><text x="900" y="249">anuluj termin</text>
<text x="1218" y="500">tak →</text><text x="1288" y="575">nie →</text>
