<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="440" viewBox="0 0 1500 440"><title>P-02 — Zarządzanie terminami przez wykładowcę</title><rect width="1500" height="440" fill="#fff"/><text x="25" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#172b4d">P-02 — Zarządzanie terminami przez wykładowcę (TO-BE)</text><rect x="20" y="50" width="1460" height="160" fill="#f8fafc" stroke="#64748b"/><rect x="20" y="210" width="1460" height="170" fill="#f0fdf4" stroke="#64748b"/><text x="30" y="72" font-family="Arial" font-size="13" fill="#334155">Wykładowca</text><text x="30" y="232" font-family="Arial" font-size="13" fill="#334155">System SKW</text><g stroke="#475569" stroke-width="2" fill="none"><path d="M85 140H110 M225 140H250 M365 140L400 290 M520 290H545 M595 290H630 M750 290H780 M900 290H930 M1050 290H1080 M1200 290H1230"/></g><g font-family="Arial" font-size="11" text-anchor="middle" fill="#172b4d"><circle cx="65" cy="140" r="18" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="110" y="108" width="115" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="167" y="134"><tspan x="167">Zaloguj się</tspan><tspan x="167" dy="14">do SKW</tspan></text><rect x="250" y="108" width="115" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="307" y="134"><tspan x="307">Wybierz</tspan><tspan x="307" dy="14">czynność</tspan></text><rect x="400" y="258" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="460" y="284"><tspan x="460">Sprawdź rolę,</tspan><tspan x="460" dy="14">właściciela, daty</tspan></text><polygon points="570,265 595,290 570,315 545,290" fill="#fff" stroke="#475569"/><text x="570" y="294" font-size="10">Zajęty?</text><rect x="630" y="258" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="690" y="284"><tspan x="690">Zapisz /</tspan><tspan x="690" dy="14">zmień termin</tspan></text><rect x="780" y="258" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="840" y="284"><tspan x="840">Wyświetl listę</tspan><tspan x="840" dy="14">zapisów</tspan></text><rect x="930" y="108" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="990" y="134"><tspan x="990">Potwierdź</tspan><tspan x="990" dy="14">anulowanie</tspan></text><rect x="1080" y="258" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1140" y="284"><tspan x="1140">Anuluj termin</tspan><tspan x="1140" dy="14">i zapisy</tspan></text><rect x="1230" y="258" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1290" y="284"><tspan x="1290">Pokaż aktualne</tspan><tspan x="1290" dy="14">statusy</tspan></text><circle cx="1410" cy="290" r="18" fill="#fff" stroke="#334155" stroke-width="4"/><text x="570" y="345" font-size="10">tak → zablokuj edycję</text><text x="25" y="414" font-size="11" fill="#64748b">Wyjątki: brak roli / cudzy termin, niepoprawny zakres dat, edycja terminu z aktywnymi zapisami.</text></g></svg>