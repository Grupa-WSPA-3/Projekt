<svg xmlns="http://www.w3.org/2000/svg" width="2060" height="900" viewBox="0 0 2060 900" role="img" aria-labelledby="title desc">
<title id="title">P-02 — Zarządzanie terminami przez wykładowcę</title>
<desc id="desc">Diagram procesu z trzema ścieżkami: utworzenie lub edycja terminu, przeglądanie listy zapisów oraz anulowanie terminu.</desc>
