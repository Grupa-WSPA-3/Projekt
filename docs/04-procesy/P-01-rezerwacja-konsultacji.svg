<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="420" viewBox="0 0 1550 420"><title>P-01 — Przeglądanie i zapis na konsultację</title><rect width="1550" height="420" fill="#fff"/><text x="25" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#172b4d">P-01 — Przeglądanie i zapis na konsultację (TO-BE)</text><rect x="20" y="50" width="1510" height="150" fill="#f8fafc" stroke="#64748b"/><rect x="20" y="200" width="1510" height="170" fill="#f0fdf4" stroke="#64748b"/><text x="30" y="72" font-family="Arial" font-size="13" fill="#334155">Student</text><text x="30" y="222" font-family="Arial" font-size="13" fill="#334155">System SKW</text>
<g stroke="#475569" stroke-width="2" fill="none"><path d="M83 132H105 M225 132H250 M365 132H390 M505 132H530 M645 132H670 M785 132H810 M925 132L960 280 M1080 280H1110 M1160 280H1200 M1315 280H1360"/></g>
<g font-family="Arial" font-size="11" text-anchor="middle" fill="#172b4d"><circle cx="65" cy="132" r="18" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="105" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="165" y="126"><tspan x="165">Zaloguj się</tspan><tspan x="165" dy="14">do SKW</tspan></text><polygon points="390,107 415,132 390,157 365,132" fill="#fff" stroke="#475569"/><text x="390" y="136" font-size="10">Rola?</text><rect x="430" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="490" y="126"><tspan x="490">Przeglądaj</tspan><tspan x="490" dy="14">terminy</tspan></text><rect x="570" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="630" y="126"><tspan x="630">Filtruj listę</tspan><tspan x="630" dy="14">terminów</tspan></text><rect x="710" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="770" y="126"><tspan x="770">Otwórz</tspan><tspan x="770" dy="14">szczegóły</tspan></text><rect x="850" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="910" y="126"><tspan x="910">Zatwierdź</tspan><tspan x="910" dy="14">zapis</tspan></text><rect x="960" y="248" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1020" y="274"><tspan x="1020">Sprawdź termin,</tspan><tspan x="1020" dy="14">limit i duplikat</tspan></text><polygon points="1135,255 1160,280 1135,305 1110,280" fill="#fff" stroke="#475569"/><text x="1135" y="284" font-size="10">Wolny?</text><polygon points="1230,255 1255,280 1230,305 1205,280" fill="#fff" stroke="#475569"/><text x="1230" y="284" font-size="10">Duplikat?</text><rect x="1280" y="248" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1340" y="274"><tspan x="1340">Utwórz</tspan><tspan x="1340" dy="14">aktywny zapis</tspan></text><circle cx="1450" cy="280" r="18" fill="#fff" stroke="#334155" stroke-width="4"/><text x="1450" y="318">Zapis potwierdzony</text><text x="410" y="90" font-size="10">tak →</text><text x="388" y="177" font-size="10">nie → odmowa dostępu</text><text x="1135" y="340" font-size="10">nie → zapis już istnieje</text><text x="1230" y="360" font-size="10">nie → utwórz zapis</text><text x="25" y="402" font-size="11" fill="#64748b">Wyjątki: brak uprawnień, termin niedostępny oraz istniejący zapis; kontrola limitu chroni ostatnie miejsce przed równoczesnym zapisem.</text></g></svg>