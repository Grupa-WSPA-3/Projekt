<svg xmlns="http://www.w3.org/2000/svg" width="2640" height="760" viewBox="0 0 2640 760" role="img" aria-labelledby="title desc">
<title id="title">P-01 — Przeglądanie i zapis na konsultację (TO-BE)</title>
<desc id="desc">BPMN 2.0: jedna pula Uczelnia z torami Student i System SKW. Trzy bramki XOR kierują do odrębnych końców: termin niedostępny, duplikat, brak miejsca albo zapis potwierdzony.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <style>
    .pool{fill:#fff;stroke:#64748b;stroke-width:2}
    .lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
    .lanehead{fill:#e8eef5;stroke:#94a3b8;stroke-width:1.5}
    .task{fill:#fff;stroke:#315a7d;stroke-width:2;rx:10}
    .service{fill:#edf5fb;stroke:#315a7d;stroke-width:2;rx:10}
    .gateway{fill:#fff5dd;stroke:#9a6a14;stroke-width:2.2}
    .start{fill:#e5f5e9;stroke:#287447;stroke-width:3}
    .endok{fill:#e5f5e9;stroke:#287447;stroke-width:4}
    .endbad{fill:#fff0ef;stroke:#b13b37;stroke-width:4}
    .flow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    .title{font:700 27px Arial,sans-serif;fill:#13263a}
    .subtitle{font:14px Arial,sans-serif;fill:#475569}
    .laneText{font:700 19px Arial,sans-serif;fill:#27384b}
    .taskText{font:600 15px Arial,sans-serif;fill:#213246}
    .small{font:14px Arial,sans-serif;fill:#34465b}
    .yes{font:700 14px Arial,sans-serif;fill:#287447}
    .no{font:700 14px Arial,sans-serif;fill:#ad3531}
    .footer{font:13px Arial,sans-serif;fill:#475569}
  </style>
</defs>
<rect x="20" y="18" width="2600" height="720" rx="18" fill="#fff" stroke="#d8dee7"/>
<text x="55" y="60" class="title">P-01 · Przeglądanie i zapis na konsultację</text>
<text x="55" y="86" class="subtitle">BPMN 2.0 · pula: Uczelnia · tory: Student / System SKW · warunek wejściowy: zalogowany Student (FR-01, FR-02)</text>

<rect class="pool" x="70" y="110" width="2510" height="550" rx="4"/>
<rect class="lane" x="70" y="110" width="2510" height="150"/>
<rect class="lanehead" x="70" y="110" width="115" height="150"/>
<text class="laneText" x="128" y="190" text-anchor="middle" transform="rotate(-90 128 190)">STUDENT</text>
<rect class="lane" x="70" y="260" width="2510" height="400"/>
<rect class="lanehead" x="70" y="260" width="115" height="400"/>
<text class="laneText" x="128" y="462" text-anchor="middle" transform="rotate(-90 128 462)">SYSTEM SKW</text>

<!-- Student tasks -->
<circle class="start" cx="210" cy="185" r="18"/>
<path class="flow" d="M228 185 H265"/>
<rect class="task" x="265" y="145" width="125" height="80"/>
<text class="taskText" x="327" y="174" text-anchor="middle"><tspan x="327">Przegląda</tspan><tspan x="327" dy="20">konsultacje</tspan></text>
<path class="flow" d="M390 185 H430"/>
<rect class="task" x="430" y="145" width="140" height="80"/>
<text class="taskText" x="500" y="174" text-anchor="middle"><tspan x="500">Określa filtry</tspan><tspan x="500" dy="20">wykładowcy / daty</tspan></text>
<path class="flow" d="M570 185 H610 V397 H645"/>
<rect class="service" x="645" y="355" width="165" height="85"/>
<text class="taskText" x="727" y="382" text-anchor="middle"><tspan x="727">Wyszukuje</tspan><tspan x="727" dy="20">i pokazuje terminy</tspan><tspan x="727" dy="20">z wolnymi miejscami</tspan></text>
<path class="flow" d="M810 397 H840 V185 H875"/>
<rect class="task" x="875" y="145" width="140" height="80"/>
<text class="taskText" x="945" y="174" text-anchor="middle"><tspan x="945">Wybiera termin</tspan><tspan x="945" dy="20">i szczegóły</tspan></text>
<path class="flow" d="M1015 185 H1055"/>
<rect class="task" x="1055" y="145" width="150" height="80"/>
<text class="taskText" x="1130" y="174" text-anchor="middle"><tspan x="1130">Inicjuje zapis</tspan><tspan x="1130" dy="20">na termin</tspan></text>
<path class="flow" d="M1205 185 H1235 V397 H1270"/>

<!-- System validation and gateways -->
<rect class="service" x="1270" y="355" width="160" height="85"/>
<text class="taskText" x="1350" y="382" text-anchor="middle"><tspan x="1350">Sprawdza status</tspan><tspan x="1350" dy="20">i datę terminu</tspan></text>
<path class="flow" d="M1430 397 H1465"/>
<polygon class="gateway" points="1490,362 1525,397 1490,432 1455,397"/>
<text class="small" x="1490" y="462" text-anchor="middle">Termin aktywny</text>
<text class="small" x="1490" y="480" text-anchor="middle">i przyszły?</text>
<path class="flow" d="M1525 397 H1570"/>
<text class="yes" x="1538" y="384">TAK</text>
<path class="flow" d="M1490 432 V555 H1515"/>
<text class="no" x="1500" y="516">NIE</text>
<rect class="service" x="1515" y="520" width="150" height="70"/>
<text class="taskText" x="1590" y="547" text-anchor="middle"><tspan x="1590">Odrzuca:</tspan><tspan x="1590" dy="20">termin niedostępny</tspan></text>
<path class="flow" d="M1665 555 H1700"/>
<circle class="endbad" cx="1720" cy="555" r="18"/>
<text class="small" x="1720" y="594" text-anchor="middle">Termin niedostępny</text>

<rect class="service" x="1570" y="355" width="155" height="85"/>
<text class="taskText" x="1647" y="382" text-anchor="middle"><tspan x="1647">Sprawdza</tspan><tspan x="1647" dy="20">duplikat zapisu</tspan></text>
<path class="flow" d="M1725 397 H1760"/>
<polygon class="gateway" points="1795,362 1830,397 1795,432 1760,397"/>
<text class="small" x="1795" y="462" text-anchor="middle">Aktywny zapis</text>
<text class="small" x="1795" y="480" text-anchor="middle">już istnieje?</text>
<path class="flow" d="M1795 432 V520 H1790"/>
<text class="yes" x="1807" y="503">TAK</text>
<rect class="service" x="1790" y="520" width="155" height="70"/>
<text class="taskText" x="1867" y="547" text-anchor="middle"><tspan x="1867">Odrzuca:</tspan><tspan x="1867" dy="20">duplikat</tspan></text>
<path class="flow" d="M1945 555 H1980"/>
<circle class="endbad" cx="2000" cy="555" r="18"/>
<text class="small" x="2000" y="594" text-anchor="middle">Duplikat</text>
<path class="flow" d="M1830 397 H1870"/>
<text class="no" x="1840" y="384">NIE</text>

<rect class="service" x="1870" y="355" width="165" height="85"/>
<text class="taskText" x="1952" y="382" text-anchor="middle"><tspan x="1952">Atomowo sprawdza</tspan><tspan x="1952" dy="20">wolne miejsce</tspan></text>
<path class="flow" d="M2035 397 H2070"/>
<polygon class="gateway" points="2105,362 2140,397 2105,432 2070,397"/>
<text class="small" x="2105" y="462" text-anchor="middle">Jest wolne</text>
<text class="small" x="2105" y="480" text-anchor="middle">miejsce?</text>
<path class="flow" d="M2105 432 V555 H2120"/>
<text class="no" x="2117" y="516">NIE</text>
<rect class="service" x="2120" y="520" width="150" height="70"/>
<text class="taskText" x="2195" y="547" text-anchor="middle"><tspan x="2195">Odrzuca:</tspan><tspan x="2195" dy="20">brak miejsca</tspan></text>
<path class="flow" d="M2270 555 H2305"/>
<circle class="endbad" cx="2325" cy="555" r="18"/>
<text class="small" x="2325" y="594" text-anchor="middle">Brak miejsca</text>

<path class="flow" d="M2140 397 H2190"/>
<text class="yes" x="2150" y="384">TAK</text>
<rect class="service" x="2190" y="355" width="150" height="85"/>
<text class="taskText" x="2265" y="382" text-anchor="middle"><tspan x="2265">Tworzy aktywny</tspan><tspan x="2265" dy="20">zapis i aktualizuje</tspan><tspan x="2265" dy="20">dostępność</tspan></text>
<path class="flow" d="M2340 397 H2370"/>
<rect class="service" x="2370" y="355" width="145" height="85"/>
<text class="taskText" x="2442" y="382" text-anchor="middle"><tspan x="2442">Pokazuje</tspan><tspan x="2442" dy="20">potwierdzenie</tspan><tspan x="2442" dy="20">i status</tspan></text>
<path class="flow" d="M2515 397 H2550"/>
<circle class="endok" cx="2570" cy="397" r="18"/>
<text class="small" x="2540" y="345" text-anchor="end">Zapis potwierdzony</text>

<text class="footer" x="85" y="700">Wyjątki: termin nieaktywny / przeszły, duplikat aktywnego zapisu, brak miejsca (w tym równoczesna próba zajęcia ostatniego miejsca).</text>
<text class="footer" x="85" y="721">Wyświetlenie terminu nie rezerwuje miejsca. Kontrola limitu jest wykonywana ponownie atomowo przed utworzeniem zapisu. Diagram jest zgodny ze źródłem BPMN P-01.</text>
</svg>
