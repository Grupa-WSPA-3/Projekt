<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390"><title>P-03 — Anulowanie własnego zapisu przez studenta</title><rect width="1400" height="390" fill="#fff"/><text x="25" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#172b4d">P-03 — Anulowanie własnego zapisu przez studenta (TO-BE)</text><rect x="20" y="50" width="1360" height="135" fill="#f8fafc" stroke="#64748b"/><rect x="20" y="185" width="1360" height="150" fill="#f0fdf4" stroke="#64748b"/><text x="30" y="72" font-family="Arial" font-size="13" fill="#334155">Student</text><text x="30" y="207" font-family="Arial" font-size="13" fill="#334155">System SKW</text><g stroke="#475569" stroke-width="2" fill="none"><path d="M83 132H110 M225 132H250 M365 132H390 M505 132L540 260 M665 260H700 M820 260H850 M970 260H1000 M1120 260H1150"/></g><g font-family="Arial" font-size="11" text-anchor="middle" fill="#172b4d"><circle cx="65" cy="132" r="18" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="110" y="100" width="115" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="167" y="126"><tspan x="167">Zaloguj się</tspan><tspan x="167" dy="14">do SKW</tspan></text><rect x="250" y="100" width="115" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="307" y="126"><tspan x="307">Otwórz listę</tspan><tspan x="307" dy="14">własnych zapisów</tspan></text><rect x="390" y="100" width="115" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="447" y="126"><tspan x="447">Wybierz</tspan><tspan x="447" dy="14">zapis</tspan></text><rect x="540" y="228" width="125" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="602" y="254"><tspan x="602">Sprawdź</tspan><tspan x="602" dy="14">właściciela i status</tspan></text><polygon points="725,235 750,260 725,285 700,260" fill="#fff" stroke="#475569"/><text x="725" y="264" font-size="10">Własny?</text><rect x="850" y="100" width="120" height="64" rx="9" fill="#e0f2fe" stroke="#2563eb"/><text x="910" y="126"><tspan x="910">Potwierdź</tspan><tspan x="910" dy="14">anulowanie</tspan></text><rect x="1000" y="228" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1060" y="254"><tspan x="1060">Anuluj zapis</tspan><tspan x="1060" dy="14">i zwolnij miejsce</tspan></text><rect x="1150" y="228" width="120" height="64" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="1210" y="254"><tspan x="1210">Pokaż wynik</tspan><tspan x="1210" dy="14">i status</tspan></text><circle cx="1330" cy="260" r="18" fill="#fff" stroke="#334155" stroke-width="4"/><text x="725" y="316" font-size="10">nie → odmowa, bez zmiany danych</text><text x="25" y="365" font-size="11" fill="#64748b">Granica czasowa anulowania pozostaje otwartą kwestią Q-03 — nie przyjęto niepotwierdzonej reguły.</text></g></svg>