<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="740" viewBox="0 0 2480 740" role="img" aria-labelledby="title desc">
<title id="title">P-00 — Obecny sposób organizacji konsultacji (AS-IS)</title>
<desc id="desc">Hipotetyczny diagram BPMN AS-IS. Jedna pula Uczelnia, tory Student i Wykładowca. Czerwoną ramką oznaczono punkty bólu: rozproszone informacje, ręczny kontakt, ręczne sprawdzanie dostępności, propozycję alternatywy, prywatną listę i ponowny kontakt przy zmianie.</desc>
<defs>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
 <style>
 .pool{fill:#fff;stroke:#64748b;stroke-width:2}.lane{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.head{fill:#e8eef5;stroke:#94a3b8;stroke-width:1.5}
 .task{fill:#fff4f3;stroke:#b33b36;stroke-width:2.5;rx:9}.taskplain{fill:#fff;stroke:#315a7d;stroke-width:2;rx:9}
 .gate{fill:#fff5dd;stroke:#9a6a14;stroke-width:2.2}.start{fill:#e5f5e9;stroke:#287447;stroke-width:3}.end{fill:#eef5fb;stroke:#315a7d;stroke-width:3}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arr)}
 .title{font:700 26px Arial,sans-serif;fill:#13263a}.sub{font:14px Arial,sans-serif;fill:#475569}.laneText{font:700 18px Arial,sans-serif;fill:#27384b}
 .txt{font:600 14px Arial,sans-serif;fill:#27384b}.small{font:13px Arial,sans-serif;fill:#475569}.pain{font:700 13px Arial,sans-serif;fill:#a22e2a}
 </style>
</defs>
